<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suara — Cue Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D0B; --surface:#171B17; --surface-2:#1D221D; --ink:#F3F0E7;
  --muted:#B7BFB4; --line:#333B33; --coral:#FF7654; --amber:#F3C45C; --mint:#7CE0B4;
  --danger:#FF5F56;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
}
button,input{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber); outline-offset:3px}

/* ── topbar ── */
.topbar{
  display:flex; align-items:center; gap:24px; padding:18px 30px 16px;
  border-bottom:1px solid var(--line); background:#0E110E; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:14px}
.brand h1{font-family:'Fraunces',Georgia,serif; font-size:30px; font-weight:600; letter-spacing:-.04em; line-height:1}
.brand .tag{font:500 10px 'IBM Plex Mono',monospace; letter-spacing:.24em; color:var(--muted)}
.status{
  display:flex; align-items:center; gap:9px; padding:8px 14px; border:1px solid var(--line);
  border-radius:999px; font:600 11px 'IBM Plex Mono',monospace; letter-spacing:.14em;
  color:var(--muted); background:var(--surface); min-width:180px;
}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px rgba(124,224,180,.55);flex:none}
.status.live{color:var(--coral);border-color:rgba(255,118,84,.45)}
.status.live .dot{background:var(--coral);box-shadow:0 0 12px rgba(255,118,84,.7)}
.status.spot{color:var(--amber);border-color:rgba(243,196,92,.45)}
.status.spot .dot{background:var(--amber);box-shadow:0 0 12px rgba(243,196,92,.6)}
.status.muted{color:var(--danger);border-color:rgba(255,95,86,.45)}
.status.muted .dot{background:var(--danger);box-shadow:0 0 12px rgba(255,95,86,.6)}
.top-spacer{flex:1}
.output{display:flex;align-items:center;gap:10px;font:500 11px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.1em}
.output select{
  appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:9px 32px 9px 12px;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.clock{font:500 12px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.1em}

/* ── main ── */
main{flex:1; padding:22px 30px 138px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font:600 13px 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.sec-head p{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.card{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:14px 15px 13px; min-height:274px; display:flex; flex-direction:column;
  transition:border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
}
.card:hover{border-color:#556150; background:var(--surface-2); transform:translateY(-2px)}
.card.onair{border-color:var(--coral); background:#211914; box-shadow:0 0 0 1px rgba(255,118,84,.25),0 12px 34px rgba(255,118,84,.09)}
.card.silent{border-color:var(--amber)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.num{font:600 11px 'IBM Plex Mono',monospace;color:var(--ink);letter-spacing:.08em}
.card.onair .num,.card.silent .num{color:var(--coral)}
.badge{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.card.onair .badge,.card.silent .badge{color:var(--coral);border-color:rgba(255,118,84,.4)}
.dur{margin-left:auto;font:500 10px 'IBM Plex Mono',monospace;color:var(--muted)}
.title{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.02em;margin-bottom:4px}
.artist{font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{height:20px;margin:10px 0 8px;display:flex;align-items:center;gap:2px;opacity:.55}
.wave i{display:block;width:3px;min-width:2px;flex:1;background:var(--muted);border-radius:2px;opacity:.5}
.card.onair .wave i{background:var(--coral);opacity:.85}
.card.silent .wave i{background:var(--amber);opacity:.7}

/* ── volume: slider kartu ikut bergerak saat fade ── */
.volhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.volhead span{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--muted)}
.volhead b{font:600 11px 'IBM Plex Mono',monospace;color:var(--ink)}
.vrange input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:ew-resize;
}
.vrange input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track,#2A332A)}
.vrange input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--track,#2A332A)}
.vrange input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:20px;margin-top:-7px;
  border-radius:5px;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);
}
.vrange input[type=range]::-moz-range-thumb{
  width:14px;height:18px;border-radius:5px;background:var(--ink);
  border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);
}
.card.onair .vrange input[type=range]::-webkit-slider-thumb{background:var(--coral)}
.card.onair .vrange input[type=range]::-moz-range-thumb{background:var(--coral)}
.fade-set{display:flex;gap:14px;margin:6px 0 0}
.fade-set label{display:flex;align-items:center;gap:5px;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--muted)}
.fade-set input{
  width:40px;background:#0E110E;border:1px solid var(--line);border-radius:5px;
  color:var(--ink);font:600 10px 'IBM Plex Mono',monospace;text-align:center;padding:4px 2px;
}

.card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:9px}
.card-state{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--muted)}
.card.onair .card-state{color:var(--coral)}
.card.silent .card-state{color:var(--amber)}
.play{
  margin-left:auto; display:flex; align-items:center; gap:8px;
  background:var(--ink); color:var(--bg); border-radius:8px; padding:9px 12px;
  font:700 11px 'IBM Plex Mono',monospace; letter-spacing:.08em; transition:background .15s ease,transform .15s ease;
}
.play:hover{background:var(--mint);transform:translateY(-1px)}
.card.onair .play,.card.silent .play{background:var(--coral);color:#160C08}
.card.onair .play:hover,.card.silent .play:hover{background:#FF8E72}
kbd{font:600 9px 'IBM Plex Mono',monospace;border:1px solid currentColor;border-radius:3px;padding:1px 4px;opacity:.65}
.stop{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--muted);flex:none}
.stop:hover{color:var(--danger);border-color:var(--danger)}
.stop svg{width:13px;height:13px;fill:currentColor}
.level{position:absolute;left:0;right:0;bottom:0;height:3px;background:#242B24;border-radius:0 0 13px 13px;overflow:hidden}
.level span{display:block;height:100%;width:0;background:var(--coral);transition:width .06s linear}
.card.silent .level span{background:var(--amber)}

/* ── transport ── */
.transport{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:#101410;border-top:1px solid var(--line);
  padding:14px 30px 18px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  box-shadow:0 -18px 40px rgba(0,0,0,.45);
}
.now{min-width:250px;max-width:320px;flex:1}
.now .lbl{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
.now .nm{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .ar{font:400 10px 'IBM Plex Mono',monospace;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:5px;background:#242B24;border-radius:3px;margin-top:10px;overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--coral);transition:width .06s linear}
.ctl{display:flex;align-items:center;gap:10px}
.tbtn{
  display:flex;align-items:center;gap:9px;padding:14px 17px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;
  transition:background .15s ease,border-color .15s ease,transform .15s ease;
}
.tbtn:hover{background:var(--surface-2);border-color:#556150;transform:translateY(-1px)}
.tbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn.vol{color:var(--mint);border-color:rgba(124,224,180,.35)}
.tbtn.stop{color:var(--coral);border-color:rgba(255,118,84,.35)}
.tbtn kbd{opacity:.55}
.master{display:flex;align-items:center;gap:12px;margin-left:auto}
.mute{
  padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--muted);transition:all .15s ease;
}
.mute:hover{border-color:var(--danger);color:var(--danger)}
.mute.on{background:var(--danger);border-color:var(--danger);color:#1A0706}
.pct{font:600 22px 'IBM Plex Mono',monospace;color:var(--ink);min-width:64px;text-align:right}

@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px 16px 170px}.topbar,.transport{padding-left:16px;padding-right:16px}.master{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Suara.</h1>
    <span class="tag">CUE DESK</span>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">SIAP</span>
  </div>
  <div class="top-spacer"></div>
  <div class="output">
    <span>OUTPUT</span>
    <select aria-label="Output audio">
      <option>Speaker Laptop</option>
      <option>USB Audio Device</option>
      <option>HDMI / External</option>
    </select>
  </div>
  <div class="clock" id="clock">00:00:00</div>
</header>

<main>
  <div class="sec-head">
    <h2>Papan Lagu</h2>
    <p>1–8 PILIH &nbsp;·&nbsp; ↑↓ VOLUME &nbsp;·&nbsp; X STOP &nbsp;·&nbsp; M MUTE &nbsp;·&nbsp; 0 DETIK = LANGSUNG</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="transport">
  <div class="now">
    <div class="lbl">ON AIR</div>
    <div class="nm" id="nowTitle">— belum ada lagu —</div>
    <div class="ar" id="nowArtist">pilih kartu untuk memulai</div>
    <div class="meter"><span id="meterFill"></span></div>
  </div>
  <div class="ctl">
    <button class="tbtn vol" id="btnVolDown" aria-label="Kurangi volume kartu aktif">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 6M21 9l-5 6"/></svg>
      VOL − <kbd>↓</kbd>
    </button>
    <button class="tbtn vol" id="btnVolUp" aria-label="Tambah volume kartu aktif">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 6M16 15l5-6"/></svg>
      VOL + <kbd>↑</kbd>
    </button>
    <button class="tbtn stop" id="btnStop" aria-label="Stop dengan hitung mundur kartu">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      STOP <kbd>X</kbd>
    </button>
  </div>
  <div class="master">
    <button class="mute" id="btnMute" aria-pressed="false">MUTE SEMUA <kbd>M</kbd></button>
    <div class="pct" id="pct">0%</div>
  </div>
</footer>

<script>
const tracks=[
  {t:'Sambutan Pembuka', a:'intro · warm keys', src:'MUSIC', dur:'2:48', vol:80, fout:3, fin:0, seed:1},
  {t:'Walk In — MC', a:'intro · woodwind', src:'MUSIC', dur:'1:32', vol:72, fout:3, fin:0, seed:7},
  {t:'Sambutan — Kepala Sekolah', a:'pengiring · strings', src:'MUSIC', dur:'3:10', vol:88, fout:4, fin:2, seed:13},
  {t:'Sambutan — Tamu Undangan', a:'pengiring · gitar', src:'MUSIC', dur:'2:24', vol:70, fout:3, fin:0, seed:21},
  {t:'Pengumuman', a:'ringan · perkusi', src:'DOWNLOAD', dur:'1:45', vol:65, fout:2, fin:1, seed:29},
  {t:'Antar Kembali', a:'outro · akustik', src:'MUSIC', dur:'2:02', vol:78, fout:3, fin:0, seed:37},
  {t:'Lagu Penutup', a:'orkestra · penutup', src:'MUSIC', dur:'3:36', vol:90, fout:5, fin:3, seed:43},
  {t:'Cadangan', a:'instrumental · cadangan', src:'DOWNLOAD', dur:'2:15', vol:60, fout:3, fin:0, seed:51},
];
const grid=document.getElementById('grid');
let active=-1, level=0, muted=false, raf=null, fadingOut=false, fadingIn=false, fadeLeft=0;

function bars(seed){
  let s=seed,out='';
  for(let i=0;i<44;i++){s=(s*1103515245+12345)&0x7fffffff;const h=12+((s>>7)%68);out+=`<i style="height:${h}%"></i>`}
  return out;
}
tracks.forEach((tr,i)=>{
  const el=document.createElement('article');
  el.className='card'; el.dataset.i=i;
  el.innerHTML=`
    <div class="card-top"><span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="badge">${tr.src}</span><span class="dur">${tr.dur}</span></div>
    <div class="title">${tr.t}</div><div class="artist">${tr.a}</div>
    <div class="wave" aria-hidden="true">${bars(tr.seed)}</div>
    <div class="volhead"><span>VOLUME KARTU</span><b class="volNum">${tr.vol}%</b></div>
    <div class="vrange"><input type="range" min="0" max="100" step="1" value="${tr.vol}" aria-label="Volume ${tr.t}"></div>
    <div class="fade-set">
      <label>KELUAR <input class="fout" type="number" min="0" max="30" step="0.5" value="${tr.fout}" aria-label="Detik fade keluar ${tr.t}">s</label>
      <label>MASUK <input class="fin" type="number" min="0" max="30" step="0.5" value="${tr.fin}" aria-label="Detik fade masuk ${tr.t}">s</label>
    </div>
    <div class="card-foot">
      <span class="card-state">SIAP</span>
      <button class="play" data-play="${i}" aria-label="Putar ${tr.t}"><span class="lab">PUTAR</span><kbd>${i+1}</kbd></button>
      <button class="stop" data-stop="${i}" aria-label="Hentikan ${tr.t}" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    </div>
    <div class="level"><span></span></div>`;
  grid.appendChild(el);
});

const statusEl=document.getElementById('status'), statusText=document.getElementById('statusText');
const nowTitle=document.getElementById('nowTitle'), nowArtist=document.getElementById('nowArtist');
const meterFill=document.getElementById('meterFill'), pct=document.getElementById('pct');
const muteBtn=document.getElementById('btnMute');
const cards=[...document.querySelectorAll('.card')];

function setSlider(card,v){
  const inp=card.querySelector('.vrange input');
  inp.value=v;
  inp.style.setProperty('--track',`linear-gradient(90deg,#FF7654 ${v}%,#2A332A ${v}%)`);
  card.querySelector('.volNum').textContent=Math.round(v)+'%';
}
function restoreSlider(card,i){setSlider(card,tracks[i].vol)}
cards.forEach((c,i)=>setSlider(c,tracks[i].vol));

function numSec(v){const n=parseFloat(v);return Number.isFinite(n)&&n>0?Math.min(n,30):0}
grid.addEventListener('input',e=>{
  const t=e.target, card=t.closest('.card'); if(!card)return;
  const i=+card.dataset.i;
  if(t.type==='range'){
    tracks[i].vol=+t.value;
    setSlider(card,+t.value);
    if(active===i){cancelRaf();fadingOut=false;fadingIn=false;fadeLeft=0;level=tracks[i].vol}
    setState();
  } else if(t.classList.contains('fout')) tracks[i].fout=numSec(t.value);
  else if(t.classList.contains('fin')) tracks[i].fin=numSec(t.value);
});

function setState(){
  cards.forEach((c,i)=>{
    const on=i===active;
    c.classList.toggle('onair',on && level>0);
    c.classList.toggle('silent',on && level<=0);
    c.querySelector('.lab').textContent= on ? 'SEDANG DIPUTAR' : 'PUTAR';
    c.querySelector('.card-state').textContent= on
      ? (fadingOut?'HITUNG MUNDUR '+fadeLeft.toFixed(1)+'s'
        : fadingIn?'FADE MASUK '+fadeLeft.toFixed(1)+'s'
        : level<=0?'VOLUME 0%':'ON AIR')
      : 'SIAP';
    c.querySelector('.level span').style.width=(on?level:0)+'%';
  });
  const tr=active>=0?tracks[active]:null;
  nowTitle.textContent=tr?tr.t:'— belum ada lagu —';
  nowArtist.textContent=tr?(fadingOut?'hitung mundur '+fadeLeft.toFixed(1)+'s · '+Math.round(level)+'%'
    : fadingIn?'naik ke '+tr.vol+'% · '+Math.round(level)+'%'
    : 'volume kartu '+tr.vol+'%'):'pilih kartu untuk memulai';
  meterFill.style.width=(muted?0:level)+'%';
  pct.textContent=Math.round(muted?0:level)+'%';
  statusEl.className='status'+(muted?' muted':!tr?'':fadingOut||fadingIn||level<=0?' spot':' live');
  statusText.textContent=muted?'MUTE SEMUA':!tr?'SIAP'
    :fadingOut?'HITUNG MUNDUR '+fadeLeft.toFixed(1)+'s'
    :fadingIn?'FADE MASUK '+fadeLeft.toFixed(1)+'s'
    :level<=0?'SUNYI · VOLUME 0%':'ON AIR · '+tr.src;
  muteBtn.classList.toggle('on',muted);
  muteBtn.setAttribute('aria-pressed',String(muted));
}
function cancelRaf(){if(raf)cancelAnimationFrame(raf);raf=null}
function ramp(to,secs,done){
  const from=level, t0=performance.now(), dur=Math.max(16,secs*1000);
  (function step(now){
    const p=Math.min(1,(now-t0)/dur);
    level=from+(to-from)*p;
    fadeLeft=Math.max(0,(1-p)*secs);
    if(active>=0)setSlider(cards[active],level);
    setState();
    if(p<1)raf=requestAnimationFrame(step);
    else{raf=null;fadeLeft=0;if(done)done()}
  })(t0);
}
function play(i){
  cancelRaf();fadingOut=false;fadingIn=false;active=i;
  const fin=numSec(tracks[i].fin);
  if(fin>0){
    level=0;setSlider(cards[i],0);fadingIn=true;setState();
    ramp(tracks[i].vol,fin,()=>{fadingIn=false;setState()});
  } else {
    level=tracks[i].vol;setSlider(cards[i],tracks[i].vol);setState();
  }
}
function stop(){
  if(active<0)return;
  const i=active;
  if(fadingOut||fadingIn){
    cancelRaf();fadingOut=false;fadingIn=false;fadeLeft=0;
    restoreSlider(cards[i],i);active=-1;level=0;setState();return;
  }
  const fout=numSec(tracks[i].fout);
  if(fout>0){
    fadingOut=true;
    ramp(0,fout,()=>{fadingOut=false;restoreSlider(cards[i],i);active=-1;level=0;setState()});
  } else {restoreSlider(cards[i],i);active=-1;level=0;setState()}
}
function mute(){muted=!muted;setState()}
function stepVolume(d){
  if(active<0)return;
  const card=cards[active], inp=card.querySelector('.vrange input');
  inp.value=Math.max(0,Math.min(100,+inp.value+d));
  tracks[active].vol=+inp.value;setSlider(card,+inp.value);
  cancelRaf();fadingOut=false;fadingIn=false;fadeLeft=0;level=tracks[active].vol;setState();
}
grid.addEventListener('click',e=>{
  const p=e.target.closest('[data-play]'); if(p){play(+p.dataset.play);return}
  const s=e.target.closest('[data-stop]'); if(s && +s.dataset.stop===active)stop();
});
document.getElementById('btnVolDown').onclick=()=>stepVolume(-5);
document.getElementById('btnVolUp').onclick=()=>stepVolume(5);
document.getElementById('btnStop').onclick=stop;
muteBtn.onclick=mute;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.type==='range'||e.target.type==='number')return;
  if(/^[1-8]$/.test(e.key)){play(+e.key-1);e.preventDefault()}
  else if(e.key==='ArrowDown'){stepVolume(-5);e.preventDefault()}
  else if(e.key==='ArrowUp'){stepVolume(5);e.preventDefault()}
  else if(e.key.toLowerCase()==='x')stop();
  else if(e.key.toLowerCase()==='m')mute();
});
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour12:false})},1000);
setState();
</script>
</body>
</html>
