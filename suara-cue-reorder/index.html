<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suara — Cue Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D0B;--surface:#171B17;--ink:#F3F0E7;--muted:#B7BFB4;--line:#333B33;--coral:#FF7654;--mint:#7CE0B4}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.topbar{display:flex;align-items:center;gap:20px;padding:15px 30px 13px;border-bottom:1px solid var(--line);background:#0E110E;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px}.brand h1{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1}
.brand .tag{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.24em;color:var(--muted)}
.status{display:flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--muted);background:var(--surface);min-width:170px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px rgba(124,224,180,.55);flex:none}
.edit-btn{display:flex;align-items:center;gap:9px;padding:10px 15px;border:1px solid var(--mint);border-radius:8px;color:var(--mint);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;white-space:nowrap;transition:transform .12s,background .16s,color .16s}
.edit-btn:active{transform:scale(.96)}
.edit-btn .ico{font-size:13px;line-height:1;transition:transform .3s}
body.editing .edit-btn{background:var(--mint);color:#0B0D0B}
body.editing .edit-btn .ico{transform:rotate(90deg)}
.top-spacer{flex:1}.output{display:flex;align-items:center;gap:10px;font:500 11px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.1em}
.output select{appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:500 11px 'IBM Plex Mono',monospace}
.clock{font:500 12px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.1em}
main{flex:1;padding:16px 30px 138px}
.palets{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.palet{padding:9px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;white-space:nowrap;flex:none}
.palet.on{border-color:var(--coral);color:var(--ink);background:#211914}
.hint{display:none;align-items:center;gap:10px;margin:10px 0 14px;padding:10px 14px;border:1px dashed rgba(124,224,180,.5);border-radius:9px;background:rgba(124,224,180,.06);color:var(--mint);font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;transition:opacity .2s}
body.editing .hint{display:flex;animation:hintIn .3s ease both}
@keyframes hintIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.hint .grip{font-size:15px;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font:600 13px 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase}
.sec-head p{font:400 10px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.06em}
.sec-actions{display:flex;gap:8px}.add{padding:10px 14px;border:1px solid var(--mint);border-radius:8px;color:var(--mint);font:600 11px 'IBM Plex Mono',monospace}
.add.alt{border-color:var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px 13px;min-height:326px;display:flex;flex-direction:column;user-select:none;touch-action:pan-y;will-change:transform}
.card.onair{border-color:var(--coral);background:#211914;box-shadow:0 0 0 1px rgba(255,118,84,.25),0 12px 34px rgba(255,118,84,.09)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.grip{display:none;width:22px;height:22px;place-items:center;border:1px solid rgba(124,224,180,.45);border-radius:5px;color:var(--mint);font:600 13px 'IBM Plex Mono',monospace;line-height:1;cursor:grab;transition:background .15s,transform .15s}
.grip:hover{background:rgba(124,224,180,.18);transform:scale(1.08)}
.num{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em}.card.onair .num{color:var(--coral)}
.badge{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.dur{margin-left:auto;font:500 10px 'IBM Plex Mono',monospace;color:var(--muted)}
.title{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.02em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font:400 11px 'IBM Plex Mono',monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave{height:20px;margin:10px 0 8px;display:flex;align-items:center;gap:2px;opacity:.55}
.wave i{display:block;width:3px;min-width:2px;flex:1;background:var(--muted);border-radius:2px;opacity:.5}
.card.onair .wave i{background:var(--coral);opacity:.85}
.time-row{display:flex;justify-content:space-between;font:500 9px 'IBM Plex Mono',monospace;color:var(--muted)}.time-row b{color:var(--ink)}
.seek{height:6px;margin-top:6px;border-radius:3px;background:#2A332A;overflow:hidden}.seek-fill{height:100%;width:0;background:var(--coral)}
.volhead{display:flex;justify-content:space-between;align-items:center;margin-top:18px;margin-bottom:12px}
.volhead span{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--muted)}.volhead b{font:600 11px 'IBM Plex Mono',monospace}
.vrange input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;display:block}
.vrange input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#2A332A}
.vrange input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:26px;margin-top:-9px;border-radius:5px;background:var(--ink);border:2px solid var(--bg)}
.durbox{margin-top:18px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#121612}
.durrow{display:flex;gap:16px}.durrow label{display:flex;align-items:center;gap:6px;font:500 9px 'IBM Plex Mono',monospace;color:var(--muted)}
.durrow input{width:44px;background:#0E110E;border:1px solid var(--line);border-radius:5px;font:600 11px 'IBM Plex Mono',monospace;text-align:center;padding:6px 2px}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:14px}
.card-state{font:500 9px 'IBM Plex Mono',monospace;color:var(--muted)}.card.onair .card-state{color:var(--coral)}
.play{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:8px;padding:9px 12px;font:700 11px 'IBM Plex Mono',monospace}
.card.onair .play{background:var(--coral);color:#160C08}
kbd{font:600 9px 'IBM Plex Mono',monospace;border:1px solid currentColor;border-radius:3px;padding:1px 4px;opacity:.65}
/* edit mode */
body.editing .card{border-style:dashed;border-color:rgba(124,224,180,.55);background:#141A15;cursor:default}
body.editing .card.onair{border-color:var(--coral);background:#211914}
body.editing .grip{display:grid}
body.editing .card .seek,body.editing .card .vrange,body.editing .card .durbox,body.editing .card .play{opacity:.32;pointer-events:none}
body.editing .card{animation:lift .34s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 35ms)}
@keyframes lift{from{transform:translateY(7px) scale(.985);opacity:.75}to{transform:none;opacity:1}}
.card.source{opacity:.28!important;filter:grayscale(.6)}
.card.slot{border-color:var(--coral)!important;background:rgba(255,118,84,.08)!important;transform:scale(.975)}
.card.slot::after{content:'LEPAS DI SINI';position:absolute;left:50%;top:-13px;transform:translateX(-50%);padding:3px 9px;border-radius:5px;background:var(--coral);color:#180B07;font:700 8px 'IBM Plex Mono',monospace;letter-spacing:.12em;white-space:nowrap;z-index:4}
.ghost{position:fixed;z-index:100;pointer-events:none;border-radius:14px;border:1px solid var(--coral);box-shadow:0 26px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,118,84,.45);overflow:hidden;transform-origin:50% 20%;opacity:.96}
.ghost::before{content:'⠿  DIPINDAHKAN';position:absolute;left:50%;top:-1px;transform:translate(-50%,-100%);padding:4px 10px;border-radius:6px 6px 0 0;background:var(--coral);color:#180B07;font:700 8px 'IBM Plex Mono',monospace;letter-spacing:.14em;white-space:nowrap}
.card.settled{animation:settle .46s cubic-bezier(.2,1.4,.4,1)}
@keyframes settle{0%{transform:scale(1.055)}55%{transform:scale(.975)}100%{transform:scale(1)}}
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,16px) scale(.96);padding:11px 19px;border:1px solid var(--mint);border-radius:999px;background:#101A12;color:var(--mint);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.16em;opacity:0;pointer-events:none;transition:all .32s cubic-bezier(.2,1.3,.4,1);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.transport{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#101410;border-top:1px solid var(--line);padding:14px 30px 18px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;box-shadow:0 -18px 40px rgba(0,0,0,.45)}
.now{min-width:250px;max-width:320px;flex:1}.now .lbl{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
.now .nm{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600}.now .ar{font:400 10px 'IBM Plex Mono',monospace;color:var(--muted);margin-top:3px}
.meter{height:5px;background:#242B24;border-radius:3px;margin-top:10px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:var(--coral)}
.ctl{display:flex;gap:10px}.tbtn{padding:14px 17px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em}
.tbtn.vol,.tbtn.loop{color:var(--mint);border-color:rgba(124,224,180,.35)}
.master{display:flex;align-items:center;gap:12px;margin-left:auto}.mute{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 11px 'IBM Plex Mono',monospace;color:var(--muted)}
.pct{font:600 22px 'IBM Plex Mono',monospace;min-width:64px;text-align:right}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px 16px 170px}.topbar,.transport{padding-left:16px;padding-right:16px}.master{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>Suara.</h1><span class="tag">CUE DESK</span></div>
  <div class="status"><span class="dot"></span><span>SIAP</span></div>
  <button class="edit-btn" id="editBtn"><span class="ico">⠿</span><span id="editLabel">ATUR POSISI</span></button>
  <div class="top-spacer"></div>
  <div class="output"><span>OUTPUT</span><select><option>Speaker Laptop</option><option>USB Audio Device</option></select></div>
  <div class="clock" id="clock">00:00:00</div>
</header>
<main>
  <div class="palets"><button class="palet on">UTAMA</button><button class="palet">SAMBUTAN</button><button class="palet">MC</button><button class="palet">+ PALET</button></div>
  <div class="hint"><span class="grip">⠿</span> TARIK KARTU UNTUK BERTUKAR POSISI · TEKAN SELESAI UNTUK MENGUNCI</div>
  <div class="sec-head">
    <h2 id="paletTitle">Papan Lagu — UTAMA</h2>
    <p>1–8 PILIH · ↑↓ VOLUME · X JEDA/LANJUT · L LOOP · M MUTE</p>
    <div class="sec-actions"><button class="add alt">+ PILIH FILE</button><button class="add">+ FOLDER</button></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast">POSISI TERKUNCI</div>
<footer class="transport">
  <div class="now"><div class="lbl">ON AIR</div><div class="nm">— belum ada lagu —</div><div class="ar">pilih kartu untuk memulai</div><div class="meter"><span></span></div></div>
  <div class="ctl"><button class="tbtn vol">VOL − <kbd>↓</kbd></button><button class="tbtn vol">VOL + <kbd>↑</kbd></button><button class="tbtn loop">LOOP <kbd>L</kbd></button></div>
  <div class="master"><button class="mute">MUTE SEMUA <kbd>M</kbd></button><div class="pct">0%</div></div>
</footer>
<script>
const tracks=[
 {t:'Sambutan Pembuka',a:'intro · warm keys',src:'MUSIC',dur:'2:48',vol:80,fout:3,fin:0,seed:1},
 {t:'Walk In — MC',a:'intro · woodwind',src:'MUSIC',dur:'1:32',vol:72,fout:2,fin:0,seed:7},
 {t:'Sambutan — Kepala Sekolah',a:'pengiring · strings',src:'MUSIC',dur:'3:10',vol:88,fout:4,fin:2,seed:13},
 {t:'Sambutan — Tamu Undangan',a:'pengiring · gitar',src:'MUSIC',dur:'2:24',vol:70,fout:3,fin:0,seed:21},
 {t:'Pengumuman',a:'ringan · perkusi',src:'DOWNLOAD',dur:'1:45',vol:65,fout:2,fin:1,seed:29},
 {t:'Antar Kembali',a:'outro · akustik',src:'MUSIC',dur:'2:02',vol:78,fout:3,fin:0,seed:37},
 {t:'Lagu Penutup',a:'orkestra · penutup',src:'MUSIC',dur:'3:36',vol:90,fout:5,fin:3,seed:43},
 {t:'Cadangan',a:'instrumental',src:'DOWNLOAD',dur:'2:15',vol:60,fout:3,fin:0,seed:51}
];
const grid=document.getElementById('grid'), toast=document.getElementById('toast'), btn=document.getElementById('editBtn');
let editing=false, dragging=null, ghost=null, offX=0, offY=0, lastTarget=null, order=tracks.map((_,i)=>i);
function bars(seed){let s=seed,o='';for(let i=0;i<44;i++){s=(s*1103515245+12345)&0x7fffffff;o+=`<i style="height:${12+((s>>7)%68)}%"></i>`}return o}
function makeCard(idx,pos){
  const c=tracks[idx], el=document.createElement('article');
  el.className='card'; el.dataset.id=idx; el.style.setProperty('--i',pos);
  el.innerHTML=`
    <div class="card-top"><span class="grip" title="Geser">⠿</span><span class="num">${String(pos+1).padStart(2,'0')}</span>
      <span class="badge">${c.src}</span><span class="dur">${c.dur}</span></div>
    <div class="title">${c.t}</div><div class="artist">${c.a}</div>
    <div class="wave" aria-hidden="true">${bars(c.seed)}</div>
    <div class="time-row"><span>POS <b>00:00</b> / ${c.dur}</span><span>TOTAL <b>00:00</b></span></div>
    <div class="seek"><div class="seek-fill"></div></div>
    <div class="volhead"><span>VOLUME KARTU</span><b>${c.vol}%</b></div>
    <div class="vrange"><input type="range" min="0" max="100" value="${c.vol}"></div>
    <div class="durbox"><div class="durrow"><label>KELUAR <input type="number" value="${c.fout}">s</label><label>MASUK <input type="number" value="${c.fin}">s</label></div></div>
    <div class="card-foot"><span class="card-state">SIAP</span><button class="play">PUTAR <kbd>${pos+1}</kbd></button></div>`;
  return el;
}
function render(){
  grid.innerHTML='';
  order.forEach((idx,pos)=>grid.appendChild(makeCard(idx,pos)));
}
function renumber(){
  [...grid.children].forEach((el,pos)=>{
    el.style.setProperty('--i',pos);
    el.querySelector('.num').textContent=String(pos+1).padStart(2,'0');
    el.querySelector('.play kbd').textContent=String(pos+1);
  });
}
function flipSwap(source,target){
  const before=new Map([...grid.children].map(el=>[el.dataset.id,el.getBoundingClientRect()]));
  const si=[...grid.children].indexOf(source), ti=[...grid.children].indexOf(target);
  if(si<0||ti<0||si===ti)return;
  const tmp=order[si]; order[si]=order[ti]; order[ti]=tmp;
  grid.insertBefore(source, ti>si?target.nextSibling:target);
  renumber();
  for(const el of grid.children){
    const old=before.get(el.dataset.id); if(!old)continue;
    const now=el.getBoundingClientRect(), dx=old.left-now.left, dy=old.top-now.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)continue;
    el.style.transition='none'; el.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>{el.style.transition='transform .27s cubic-bezier(.2,.85,.25,1)';el.style.transform='';});
  }
}
btn.addEventListener('click',()=>{
  editing=!editing;
  document.body.classList.toggle('editing',editing);
  document.getElementById('editLabel').textContent=editing?'SELESAI · KUNCI':'ATUR POSISI';
  if(!editing){
    toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1700);
    [...grid.children].forEach(el=>el.classList.remove('source','slot','settled'));
  }
});
grid.addEventListener('pointerdown',e=>{
  if(!editing)return;
  const grip=e.target.closest('.grip'), card=e.target.closest('.card');
  if(!card||(!grip&&!e.target.closest('.card-top')))return;
  const r=card.getBoundingClientRect();
  ghost=card.cloneNode(true);
  ghost.className='card ghost'; ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px';
  ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
  document.body.appendChild(ghost);
  offX=e.clientX-r.left; offY=e.clientY-r.top;
  dragging=card; card.classList.add('source');
  try{card.setPointerCapture(e.pointerId)}catch{}
  e.preventDefault();
});
grid.addEventListener('pointermove',e=>{
  if(!dragging||!ghost)return;
  ghost.style.transform=`translate(${e.clientX-offX-dragging.getBoundingClientRect().left}px,${e.clientY-offY-dragging.getBoundingClientRect().top}px) scale(1.045) rotate(-1.2deg)`;
  const stack=document.elementsFromPoint(e.clientX,e.clientY);
  const target=stack.map(x=>x.closest?.('.card')).find(c=>c&&c!==dragging&&!c.classList.contains('ghost'));
  if(lastTarget&&lastTarget!==target)lastTarget.classList.remove('slot');
  if(target){target.classList.add('slot');lastTarget=target;flipSwap(dragging,target);}
});
function endDrag(){
  if(!dragging)return;
  const moved=dragging;
  if(ghost){ghost.remove();ghost=null;}
  moved.classList.remove('source');
  if(lastTarget){lastTarget.classList.remove('slot');lastTarget=null;}
  moved.classList.add('settled'); setTimeout(()=>moved.classList.remove('settled'),500);
  dragging=null;
}
grid.addEventListener('pointerup',endDrag);
grid.addEventListener('pointercancel',endDrag);
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('id-ID',{hour12:false})},1000);
render();
</script>
</body>
</html>
