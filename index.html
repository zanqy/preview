<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — zanqy</title>
<style>
:root{--paper:#F2ECDE;--ink:#221D15;--ink-60:rgba(34,29,21,.6);--red:#C03B21;--line:rgba(34,29,21,.16)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,72px)}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;letter-spacing:-.01em;line-height:1.1}
h1 span{color:var(--red)}
p.sub{margin-top:10px;color:var(--ink-60);font-style:italic;max-width:52ch;line-height:1.6}
ul{list-style:none;margin-top:32px;border-top:1px solid var(--line);max-width:640px}
li{border-bottom:1px solid var(--line)}
a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 2px;
  color:var(--ink);text-decoration:none;font:500 12px 'Courier New',monospace;letter-spacing:.08em;
  text-transform:lowercase;transition:color .2s}
a:hover{color:var(--red)}
a small{color:var(--ink-60);font-size:10px;letter-spacing:.04em;text-transform:none}
footer{margin-top:40px;font:10px 'Courier New',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60)}
</style>
</head>
<body>
<h1>Preview<span>.</span></h1>
<p class="sub">Halaman-halaman HTML lepas yang dibuatkan Hermes untuk dicek langsung. Tiap preview ada di subfolder.</p>
<ul id="list">
  <li><a href="amplop/">amplop <small>transisi buka amplop KATAKAN.</small></a></li>
</ul>
<footer>zanqy · github pages</footer>
</body>
</html>
